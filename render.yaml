services:
  # SkillBridge Single-Service Unified Deployment (Frontend + Backend)
  - type: web
    name: skillbridge-frontend
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build && cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: SkillBridge <notifications@skillbridge.io>
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
